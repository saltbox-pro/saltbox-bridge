---

variables:
  CONFIG_FILE_PATH: './saltbox_bridge/pyproject.toml'
  PYTHON: python3.14.10


stages:
  - test
  - bump-version
  - build


include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'

  - project: 'saltbox/ci-lib'
    file: 'def-branch-merge-guard.yml'

  - project: 'saltbox/ci-lib'
    file: 'set-version.yml'


.lint-job:
  stage: test
  variables:
    APK_CACHE_DIR: '${CI_PROJECT_DIR}/.cache/apk'
    UV_CACHE_DIR: '${CI_PROJECT_DIR}/.cache/uv'
  image: alpine:latest
  before_script:
    - mkdir --parents "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" git uv
    - uv sync --project saltbox_bridge --python="$PYTHON" --extra dev --extra salt --no-sources
    - source saltbox_bridge/.venv/bin/activate
  cache:
    paths:
      - '$APK_CACHE_DIR'
      - '$UV_CACHE_DIR'


Ruff:
  extends: .lint-job
  script: 'ruff check saltbox_bridge --config $CONFIG_FILE_PATH'


Mypy:
  extends: .lint-job
  script: 'mypy saltbox_bridge --config-file $CONFIG_FILE_PATH'


Bump Salt Master version:
  stage: bump-version
  extends: .set-backend-version
  variables:
    INNER_VERSION_FILE: 'saltbox_bridge/saltbox_bridge/__init__.py'


Build Salt Master image:
  stage: build
  extends: .build-image
  variables:
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'
    EXTRA_ARGS: "--build-arg='BASE_IMG=$BASE_IMAGE'"
