---
stages:
  - lint
  - build

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'


Build salt-master for tag:
  stage: build
  extends: .build-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'
  rules:
    - if: '$CI_COMMIT_TAG'


Build salt-master image for branch:
  stage: build
  extends: .build-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
    TARGET: salt-master
    REGISTRY_ADDITIONAL_PATH: '/salt-master'
  rules:
    - if: '$CI_COMMIT_BRANCH'

ruff:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.10-alpine
  before_script:
    pip3 install -e .[dev]
  script:
    ruff check saltbox_bridge --config ./saltbox_bridge/pyproject.toml
  cache:
    paths:
      - '.cache/pip/'
