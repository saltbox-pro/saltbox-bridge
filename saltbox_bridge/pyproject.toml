[project]
name = "saltbox-bridge"
description = "salt.box connector to salt master, service module"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE.txt"]
classifiers = [
  "Topic :: System :: Systems Administration",
]
dynamic = ["version"]
dependencies = [
  "faststream[redis]==0.5.48",
  "pydantic-settings~=2.9.1",
  "pydantic~=2.12.5",
  "python-gnupg==0.5.6",
  "redis~=5.2.0",

  # Dependencies from Salt.Box Team server.
  # - Prefer tag or commit hash over branch to specify version.
  # - Prefer long hash over short hash for pip efficiency.
  "saltbox-bridge-messages @ git+https://dev.saltbox.pro/saltbox/saltbox-bridge-messages/@784c0a1cddc1e094a462e5c45ae9e674bf97e6fa",
]

[project.urls]
Repository = "https://dev.saltbox.pro/salt.box"

[project.scripts]

[project.optional-dependencies]
dev = [
  "ipython",
  "mypy",
  "pre-commit",
  "pylsp-mypy",
  "python-lsp-server[all]",
  "ruff",
  "types-redis",
]
salt = [
  "salt==3008.5",
]

[build-system]
requires = ["setuptools>=57.4.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
check_untyped_defs = true
plugins = ["pydantic.mypy"]
python_version = "3.10"
ignore_missing_imports = false
color_output = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["venv/", ".venv/", "tests/*", "engines/saltbox_delator.py"]
strict = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
implicit_reexport = false
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
mypy_path = "../../saltbox-bridge-messages/,../saltbox-bridge-messages/"
exclude_gitignore = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["docs", "env", "__pycache__", "*.egg", "htmlcov"]
respect-gitignore = true
unsafe-fixes = false

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = [
  "B",  # flake8-bugbear
  "C90",  # mccabe
  "C4",  # flake8-comprehensions
  "DTZ",  # flake8-datetimez https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  "EM",  # flake8-errmsg
  "UP",  # pyupgrade
  "FA",  # flake8-future-annotations
  "LOG",  # flake8-logging
  "PTH",  # flake8-use-pathlib
  "ASYNC",  # flake8-async
  "G",  # flake8-logging-format
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "S",  # flake8-bandit
  "W",  # pycodestyle warnings
  "N",  # pep8-naming
  "RUF",  # ruff checks
  "TD",  # flake8-todo
]
ignore = [
  "bare-except",
  "ERA",  # do not autoremove commented out code
  "error-suffix-on-exception-name",
  "noqa-comments",
  "suspicious-subprocess-import",
  "missing-todo-author",
  "missing-todo-link",
  "non-pep695-type-alias",
]
fixable = ["ALL"]
unfixable = ["unused-import", "unused-variable", "deprecated-import"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.*" = [
  "assert",
  "DTZ",
  "raw-string-in-exception",
  "mutable-class-default",
  "true-false-comparison",
]
"**/__init__.py" = ["missing-required-import"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = [
  "saltbox_bridge"
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.setuptools.packages.find]
include = ["saltbox_bridge", "saltbox_bridge.*"]

[tool.setuptools.dynamic]
version = { attr = "saltbox_bridge.__version__" }

[tool.setuptools_scm]
fallback_version = "0.0.0"

# vi: sw=2

[tool.uv.sources]
saltbox-bridge-messages = { path = "../../saltbox-bridge-messages", editable = true }
